<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Beca Ecosystem - Music Studio</title>
    <style>
        body { margin: 0; height: 200vh; background: url('yol.jpg') fixed center/cover; color: white; font-family: sans-serif; }
        #player { position: fixed; top: 10%; left: 10%; width: 450px; background: rgba(0,0,0,0.4); backdrop-filter: blur(25px); border-radius: 30px; padding: 25px; border: 1px solid rgba(255,255,255,0.2); cursor: move; transition: 0.3s; }
        .minimized { transform: scale(0.4); top: 10px; left: 10px; opacity: 0.8; }
        #lyrics { height: 300px; overflow: hidden; margin: 20px 0; text-align: center; line-height: 2; font-size: 18px; color: #ccc; }
        .active { color: #00d4ff; font-weight: bold; font-size: 22px; text-shadow: 0 0 10px #00d4ff; }
        #library { height: 150px; overflow-y: auto; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px; margin-top: 10px; font-size: 12px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="player">
        <div style="display:flex; align-items:center;">
            <img src="kelebek.png" width="30" style="margin-right:10px;">
            <input type="file" id="file" accept="audio/*">
        </div>
        <div id="progress" style="height:5px; background:gray; margin:15px 0;"><div id="bar" style="height:100%; width:0; background:#00d4ff;"></div></div>
        
        <div class="controls" style="display:flex; justify-content:center; gap:5px;">
            <button onclick="audio.currentTime -= 10">-10s</button>
            <button id="playBtn">Oynat</button>
            <button onclick="audio.currentTime += 10">+10s</button>
            <button id="repeatBtn">↺</button>
            <button onclick="share()">📤</button>
        </div>

        <div id="lyrics"></div>
        <div id="library"><b>Kütüphane:</b></div>
        
        <div style="text-align:center; margin-top:20px; font-size:11px;">
            Producer: Ilknur Ergin<br>
            <span style="color:#00d4ff;">@becaecosystem.bsky.social</span>
        </div>
    </div>

    <script>
        const audio = new Audio();
        let lyricsData = [];
        const lyricsDiv = document.getElementById('lyrics');
        const libDiv = document.getElementById('library');

        document.getElementById('file').onchange = async (e) => {
            const file = e.target.files[0];
            audio.src = URL.createObjectURL(file);
            audio.play();
            
            // Kütüphaneye ekle
            libDiv.innerHTML += `<div>${file.name}</div>`;

            // Söz çekme
            const name = file.name.replace(/\.[^/.]+$/, "");
            const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(name)}`);
            const data = await res.json();
            if(data[0]?.syncedLyrics) {
                lyricsData = data[0].syncedLyrics.split('\n').map(l => {
                    const m = l.match(/\[(\d+):(\d+\.\d+)\](.*)/);
                    return m ? { t: parseInt(m[1])*60 + parseFloat(m[2]), text: m[3] } : null;
                }).filter(l => l);
            }
        };

        audio.ontimeupdate = () => {
            document.getElementById('bar').style.width = (audio.currentTime / audio.duration * 100) + '%';
            const active = lyricsData.filter(l => l.t <= audio.currentTime).slice(-3);
            lyricsDiv.innerHTML = active.map((l, i) => `<div class="${i === 2 ? 'active' : ''}">${l.text}</div>`).join('');
        };

        function share() {
            window.open("https://bsky.app/intent/compose?text=Beca Ecosystem'de dinliyorum!");
        }

        document.getElementById('playBtn').onclick = () => audio.paused ? audio.play() : audio.pause();
        window.onscroll = () => document.getElementById('player').classList.toggle('minimized', window.scrollY > 50);
    </script>
</body>
</html>
